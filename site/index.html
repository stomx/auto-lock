<body>
  <div id="root"></div>
  <!-- FOUC 방지: React 마운트 전에 저장된 테마(system/dark/light)를 먼저 적용 -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('autolock.theme');
        var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = (pref === 'dark' || pref === 'light') ? pref : (isLight ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
