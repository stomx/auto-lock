<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background: macOS-style rounded square with deep charcoal-green -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101913"/>
      <stop offset="100%" stop-color="#0A1109"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A6FF3D" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#A6FF3D" stop-opacity="0"/>
    </radialGradient>
    <filter id="dotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#A6FF3D" flood-opacity="0.5"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- macOS app icon mask: 1024 with ~22.4% corner radius (~230) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#glow)"/>

  <!-- Lock body + shackle, lime mono -->
  <g stroke="#A6FF3D" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Shackle: rounded U above the body -->
    <path d="M 365 470
             L 365 360
             A 147 147 0 0 1 659 360
             L 659 470"
          stroke-width="62"/>
  </g>

  <!-- Lock body: filled rounded rectangle -->
  <rect x="320" y="455" width="384" height="290" rx="44" ry="44" fill="#A6FF3D"/>

  <!-- Keyhole carved from body (keep it minimal, geometric) -->
  <circle cx="512" cy="565" r="32" fill="#0A1109"/>
  <rect x="496" y="585" width="32" height="86" rx="14" ry="14" fill="#0A1109"/>

  <!-- Drifting signal dot, lower-right of the lock -->
  <circle cx="800" cy="600" r="42" fill="#A6FF3D" filter="url(#dotShadow)"/>
  <!-- Faint trail dots showing motion away -->
  <circle cx="868" cy="608" r="14" fill="#A6FF3D" opacity="0.45"/>
  <circle cx="912" cy="612" r="7" fill="#A6FF3D" opacity="0.22"/>
</svg>
